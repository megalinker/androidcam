name: build-apk

# Fast APK-only CI: builds the debug APK on every push and on manual dispatch, so the
# Android app can be installed/verified without cutting a full release. (The release
# workflow builds the same APK plus the Windows side on v-tags.)
on:
  push:
    branches: ['**']
    paths:
      - 'android/**'
      - '.github/workflows/build-apk.yml'
  workflow_dispatch:

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Decode release keystore
        run: echo "${{ secrets.ANDROID_KEYSTORE_B64 }}" | base64 -d > "$RUNNER_TEMP/phonecam-release.jks" || true
      - name: Build release APK
        working-directory: android
        env:
          PHONECAM_KEYSTORE: ${{ runner.temp }}/phonecam-release.jks
          PHONECAM_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleRelease
      - uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
